[mediaTypes."application/toon"]
  suffixes = ["toon"]

[outputFormats.TOON]
  mediaType = "application/toon"
  baseName = "index"
  isPlainText = true
  isHTML = false

# /llms.txt — the convention answer engines are converging on: one plain-text
# map of a site, curated rather than crawled, so a model reaching for us gets the
# four papers and the product page instead of whichever tag page ranked.
#
# The raw material already existed and nothing pointed at it. The TOON pipeline
# above has emitted the full corpus at /index.toon since it was built, with no
# link to it, no mention in robots.txt, and a format no crawler knows. This is
# the same idea in the format they do read. robots.txt now names the sitemap, and
# this file is linked from the homepage head.
#
# Plain text, self-hosted, no external request — rule 7 clean. It is body copy
# like any other page, so rules 1 and 3 govern what it says.
[mediaTypes."text/llms"]
  suffixes = ["txt"]

[outputFormats.LLMS]
  mediaType = "text/llms"
  baseName = "llms"
  isPlainText = true
  isHTML = false
  permalinkable = false

[outputs]
  home = ["HTML", "RSS", "TOON", "LLMS"]
  page = ["HTML", "TOON"]
  section = ["HTML", "RSS", "TOON"]
  taxonomy = ["HTML", "TOON"]
  term = ["HTML", "RSS", "TOON"]
