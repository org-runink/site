ignoreLogs = ['warning-goldmark-raw-html']
baseURL = "https://runink.org/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
title = "Runink"

# Theme Config
theme = "hugo-saasify-theme"

# Enable syntax highlighting
pygmentsCodeFences = true
pygmentsUseClasses = true

# Enable emoji support
enableEmoji = true

# Enable Git info for lastmod
enableGitInfo = true

# Enable taxonomies
[taxonomies]
  category = 'categories'
  tag = 'tags'

# Pagination
#
# These MUST stay inside their own [pagination] table and MUST NOT be written as
# bare `paginate = 6` / `paginatePath = "page"` keys again. TOML has no dedent: a
# blank line and a comment do not close [taxonomies] above, so those two keys
# were being read as two extra TAXONOMY definitions —
#
#   paginate     = '6'      ->  a taxonomy whose plural is "6"
#   paginatePath = 'page'   ->  a taxonomy whose plural is "page"
#
# — which is where the published /6/ and /page/ came from (plus /es/6/, /fr/6/,
# /pt/6/ and their /page/ twins). Both rendered through layouts/taxonomy/list.html
# with no terms to list, so they went out as near-empty pages with a blank <h1>,
# `index, follow`, and an entry in the sitemap.
#
# The second half of the same bug: because neither key ever reached pagination
# config, `paginate = 6` did nothing and list pages silently ran at Hugo's
# default of 10. pagerSize = 6 below is the value this file has always asked for
# and is now the value actually in force. `pagerSize`/`pagerPath` are the modern
# spellings (Hugo 0.128+); the bare root-level forms are deprecated regardless.
[pagination]
  pagerSize = 6
  pagerPath = "page"

[params]
  disablePostCSS = false
  description = ""
  logo = "/images/logo.png"
  googleAnalytics ='G-SEECKDWZNJ'

  # Embedded-app endpoints (Cloud Run URLs) for the /pulse and /demo iframes.
  # This is a PUBLIC repository, and Pulse/FACE are private apps, so the real
  # endpoints are NOT committed here. CI injects them at build time from
  # repository secrets via Hugo's env-var override — HUGO_PARAMS_PULSEAPPURL and
  # HUGO_PARAMS_DEMOAPPURL (see .github/workflows/deploy.yaml). Kept empty so a
  # local/dev build renders the "not configured yet" placeholder rather than a
  # stale URL. (A local preview can export those env vars to point at a running
  # instance.) Note: an iframe src is inherently visible in the deployed public
  # HTML — this keeps infra URLs out of version control and rotatable, not
  # secret from a page viewer.
  pulseAppURL = ""
  demoAppURL = ""
  coreAppURL = ""

  # Global CTA Configuration
  [params.cta]
    enable = true
    title = "Runink: Data You Can Trust. Decisions You Can Defend."
    # This is the CTA band's copy, rendered on every page that includes the partial.
    # It used to read "Your Go-to Hub for for orchestrating … cutting-edge compliant
    # technologies" — a doubled "for", and two unfalsifiable claims ("cutting-edge",
    # "compliant") of exactly the kind the rest of this site was rewritten to remove.
    # "Compliant" is the worse of the two: FACE is SOC 2-ORIENTED, a self-declared
    # design intention, not a completed audit.
    description = "Runink FACE reads the logistics records you already hold, compares them against the rules that govern them, and drafts an action for the person who owns the decision. It runs on infrastructure you control."
    # The comments below said Indigo-600 / Purple-600. The values are the warm browns
    # of the FACE palette and always were; the labels came from the vendor theme.
    gradient_from = "#3A2F2A"
    gradient_to = "#1A1512"
    gradient_angle = 30
    # /#contact-form, not /#contact. The consultation form on the home page has
    # always rendered with id="contact-form"; nothing has ever rendered
    # id="contact", so this link scrolled nowhere and returned 200 while doing
    # it. `go run linkcheck.go` now fails on exactly this.
    [params.cta.primary_button]
      text = "Book your Consultation"
      url = "/#contact-form"
  
  # Social Media Links
  [params.social]
    linkedin = "https://www.linkedin.com/company/runink"
  
  # Footer Configuration
  [params.footer]
    enable = false
  
  [params.header]
    # Header background and border styles (optional)
    background = "bg-stone-900/90 backdrop-blur-sm"
    border = "border-b border-stone-800"
    
    # Logo configuration
    [params.header.logo]
      src = "/images/logo.png"
    
    # Menu configuration
    [params.header.menu]
      # space-x-6, down from space-x-8. Giving Blog a submenu adds a chevron to
      # that entry, and at 1440 the ~24px it takes came out of the longest label
      # instead: "Ce qui nous différencie" went from two lines to three. Six
      # points back across the five gaps returns every language to the line
      # count it had before, with the flags still on the row. Measured at 1440
      # in en, fr and pt.
      spacing = "space-x-6"
      
      # Dropdown menu configuration
      [params.header.menu.dropdown]
        width = "w-72"
        container_padding = "py-6"
        item_padding = "px-8 py-3"
        background = "bg-stone-800"
        border = "border border-stone-700"
        shadow = "shadow-xl"
        radius = "rounded-lg"
        text_color = "text-[#F5F1E8]"
        hover_background = "hover:bg-stone-700 hover:text-white"
        text_size = "text-sm"
    
    # Button configuration
    [params.header.buttons]
      # Sign In button
      # [params.header.buttons.signIn]
      #   text = "Sign in"
      #   url = "/signin"
      
      # Get Started button
      # See the note on params.cta.primary_button above for the id.
      [params.header.buttons.getStarted]
        text = "Book your Consultation"
        url = "/#contact-form"

      # There is deliberately no third header button.
      #
      # A "Check it out" button lived here and pointed at /demo/, which 404'd in
      # all four languages from the July rename of content/demo.md onward. It was
      # repointed at /industries/ rather than removed — where the "Industries"
      # menu entry already went. Two controls to one page is one control and one
      # distraction, and the redundancy was invisible to anyone reading a single
      # block. scripts/check-nav-distinct.mjs reads the RENDERED header and fails
      # on it now, so re-adding a duplicate destination breaks the build rather
      # than shipping.

  # Blog configuration
  #
  # `title` and `subtitle` are the h1 and the deck on /blog/, so they are body
  # copy and CONTENT.md rules 1 and 3 govern them exactly as they would a
  # paragraph — not config. What they said until the September 2026 rewrite:
  #
  #   title    = "Publications, Insights & Expertise"
  #   subtitle = "Explore whitepapers, real-world use cases, and actionable best
  #               practices to maximize ROI from your Digital Transformation
  #               initiatives."
  #
  # Four breaches in two lines. "maximize ROI" is named in rule 1 as an invented
  # figure with the digits filed off. "Actionable best practices" and "Digital
  # Transformation initiatives" are the register rule 3 rules out — no
  # non-technical buyer would restate either in their own words. And "Expertise"
  # claims expertise in a heading rather than letting the four papers below show
  # it, which is the one thing a heading cannot do for itself.
  #
  # What replaced them says what is actually behind the URL and in what order to
  # read it: four long documents, then shorter pieces on the operational problems
  # those documents address. The examples in the deck are the homepage's own — a
  # held entry, a claim still inside its filing window — because those are
  # problems rather than results, and no figure is attached to any of them.
  #
  # `eyebrow` is the small chip above the headline, and the only uppercase line on
  # the page. It names the audience by job family, which rule 5 asks for.
  #
  # All four languages carry their own three strings, per rule 12. The Spanish,
  # French and Portuguese decks all promised "maximizar el/le/o ROI" and were
  # struck in the same change as the English one.
  [params.blog]
    enable = true
    eyebrow = "For operations, supply chain, finance and compliance"
    title = "Whitepapers, and shorter notes on the same problems."
    subtitle = "The papers are the long documents: what Runink FACE and Runink PULSE do, and the CORE platform both of them run on. The shorter pieces stay with the problems behind them — a customs entry held for a missing document, a freight claim still inside its filing window, a return that costs more to handle than the goods, a cold chain that has to be proven after the fact."

    # Blog CTA configuration
    [params.blog.cta]
      enable = true  # Enable/disable CTA in blog posts
    
    # Sidebar configuration
    [params.blog.sidebar]
      # Recent articles section
      [params.blog.sidebar.recent]
        enable = true
        title = "Recent Articles"
        count = 5
      
      # Categories section
      [params.blog.sidebar.categories]
        enable = true
        title = "Categories"
      
      # Tags section
      [params.blog.sidebar.tags]
        enable = true
        title = "Popular Tags"
        count = 20

      # Subscribe form section
      # [params.blog.sidebar.subscribe]
      #   enable = true
      #   title = "Subscribe to Newsletter"
      #   description = "Get the latest posts delivered right to your inbox"
      #   action = "https://formspree.io/f/your-form-id"
      #   emailName = "email"
      #   buttonText = "Subscribe"
      #   placeholder = "Enter your email"
      #   disclaimer = "We respect your privacy. Unsubscribe at any time."

[module]
  [module.hugoVersion]
    extended = true
    min = "0.80.0"
  
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"

[build]
  writeStats = false

[minify]
  disableXML = true
  useResourceCacheWhen = "never"

[build.buildStats]
  enable = true

[security.funcs]
  getenv = ['^HUGO_', '^CI$']

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = true
    codeFences = true
    guessSyntax = true
    lineNumbersInTable = true
  [markup.goldmark.renderer]
    unsafe = false
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

[languages]
  [languages.en]
    locale = "en-us"
    label = "English"
    weight = 1

    [[languages.en.menu.main]]
      name = "Why Runink?"
      url = "/#why-runink"
      weight = 1

    # /#painkiller was an id on the home page that the English home page no
    # longer renders — the painkiller-pitches shortcode is still called from the
    # fr/es/pt home pages but was dropped from the English one, so this entry
    # scrolled nowhere in English and nothing reported it.
    #
    # It points at a page rather than at a re-added anchor deliberately: an
    # anchor is only as durable as whichever shortcode happens to be in the home
    # page's markdown that week, and this is the second time that has broken it.
    # The whitepapers are where the painkiller claim is actually argued at
    # length, and the index exists and is translated in all four languages.
    [[languages.en.menu.main]]
      name = "Whitepapers"
      url = "/blog/whitepapers/"
      weight = 2

    # Industries sits above Use cases deliberately. The site was organised by
    # capability, which asks a buyer to recognise a product name before they can
    # find their own problem; this is the entry that lets them start from their
    # own industry instead.
    #
    # A dropdown rather than five top-level entries: the header is fixed, the
    # desktop nav already carries five items plus two buttons and four language
    # flags, and five more would either wrap or push the flags off. As a submenu
    # it costs one item's width. On mobile the same menu renders as a labelled
    # group inside the existing full-width panel, which has room.
    #
    # The industry pages exist in English only. These entries therefore point at
    # the same unprefixed paths from every language, so no locale gets a menu
    # entry that 404s. See the note in content/industries/_index.md on why there
    # are no aliases.
    [[languages.en.menu.main]]
      name = "Industries"
      url = "/industries/"
      weight = 3
      [languages.en.menu.main.params]
        has_submenu = true
        submenu = [
          { name = "Logistics & Supply Chain", url = "/industries/logistics-supply-chain/" },
          { name = "Insurance", url = "/industries/insurance/" },
          { name = "Banking & Financial Services", url = "/industries/banking-financial-services/" },
          { name = "Telecom", url = "/industries/telecom/" },
          { name = "Marketing", url = "/industries/marketing/" },
        ]

    # /#use-cases was the id of the carousel shortcode, which the English home
    # page no longer calls either. /use-cases/ is the real section: the same
    # argument at length, followed by every use case as a card, and it is
    # translated in all four languages.
    [[languages.en.menu.main]]
      name = "Use cases"
      url = "/use-cases/"
      weight = 4

    # There is deliberately no "Blog" entry, in any language.
    #
    # /blog/ and /blog/whitepapers/ are parent and child, so two entries read as
    # two blog-shaped things and a reader has to open one to find out which is
    # which. scripts/check-nav-distinct.mjs passes them — the hrefs differ — but
    # the redundancy is the kind it was written for. The papers are the
    # substantive material, so the header links them and the shorter pieces hang
    # off the papers' own index.
    #
    # That leaves /blog/ with no chrome link, and there is no footer to fall back
    # on (params.footer.enable = false, and partials/footer.html is a comment).
    # CONTENT.md rule 9 is explicit that a page with no inbound link is still
    # published, so two pages carry the way in on purpose and must keep doing so:
    # layouts/whitepapers/list.html closes with a band pointing at /blog/, and
    # every post carries an "All articles" link. linkcheck.go cannot see this —
    # /blog/ still returns 200 either way — so it is read for, not gated.

    [[languages.en.menu.main]]
      name = "Pricing"
      url = "/pricing"
      weight = 6


  [languages.fr]
    locale = "fr-fr"
    label = "Français"
    weight = 2

    [languages.fr.params.header.buttons.getStarted]
      text = "Réserver une Consultation"
      url = "/fr/#contact-form"


    # See the note on [params.blog] in the English block: these three strings are
    # the h1, the deck and the chip on /fr/blog/, so they are body copy. The deck
    # here promised "maximiser le ROI de vos initiatives de Transformation
    # Digitale", which is rule 1 in French — rules 1 and 2 have no language
    # exemption. "Livres blancs" is the label the French menu already uses.
    [languages.fr.params.blog]
      eyebrow = "Pour les opérations, la supply chain, la finance et la conformité"
      title = "Les livres blancs, et des notes plus courtes sur les mêmes problèmes."
      subtitle = "Les livres blancs sont les documents longs : ce que font Runink FACE et Runink PULSE, et la plateforme CORE sur laquelle les deux tournent. Les textes plus courts restent sur les problèmes qui les motivent — une déclaration en douane bloquée faute d'un document, une réclamation fret encore dans son délai, un retour qui coûte plus cher à traiter que la marchandise, une chaîne du froid qu'il faut prouver après coup."

    [[languages.fr.menu.main]]
      name = "Pourquoi Runink ?"
      url = "/fr/#why-runink"
      weight = 1

    [[languages.fr.menu.main]]
      name = "Livres blancs"
      url = "/fr/blog/whitepapers/"
      weight = 2

    # English pages, French label. The destinations are the unprefixed paths
    # because that is where the pages are; a /fr/industries/ entry would 404.
    [[languages.fr.menu.main]]
      name = "Secteurs"
      url = "/industries/"
      weight = 3
      [languages.fr.menu.main.params]
        has_submenu = true
        submenu = [
          { name = "Logistics & Supply Chain", url = "/industries/logistics-supply-chain/" },
          { name = "Insurance", url = "/industries/insurance/" },
          { name = "Banking & Financial Services", url = "/industries/banking-financial-services/" },
          { name = "Telecom", url = "/industries/telecom/" },
          { name = "Marketing", url = "/industries/marketing/" },
        ]

    [[languages.fr.menu.main]]
      name = "Cas d'usage"
      url = "/fr/use-cases/"
      weight = 4

    [[languages.fr.menu.main]]
      name = "Tarifs"
      url = "/fr/pricing"
      weight = 6

  [languages.es]
    locale = "es-es"
    label = "Español"
    weight = 3

    [languages.es.params.header.buttons.getStarted]
      text = "Reserve una Consulta"
      url = "/es/#contact-form"


    # Same as the French block above. The old deck promised "maximizar el ROI de
    # sus iniciativas de Transformación Digital" — rule 1, in Spanish. "Informes
    # técnicos" is the label the Spanish menu already uses for the papers, so the
    # headline uses it rather than introducing a second name for them.
    [languages.es.params.blog]
      eyebrow = "Para operaciones, cadena de suministro, finanzas y cumplimiento"
      title = "Los informes técnicos, y notas más breves sobre los mismos problemas."
      subtitle = "Los informes técnicos son los documentos largos: qué hacen Runink FACE y Runink PULSE, y la plataforma CORE sobre la que funcionan ambos. Los textos más breves se quedan con los problemas que hay detrás — una entrada de aduana retenida por un documento que falta, una reclamación de flete aún dentro de su plazo, una devolución que cuesta más tramitar que la propia mercancía, una cadena de frío que hay que demostrar después."

    [[languages.es.menu.main]]
      name = "¿Por qué Runink?"
      url = "/es/#why-runink"
      weight = 1

    [[languages.es.menu.main]]
      name = "Informes técnicos"
      url = "/es/blog/whitepapers/"
      weight = 2

    # English pages, Spanish label — same reasoning as the French block above.
    [[languages.es.menu.main]]
      name = "Sectores"
      url = "/industries/"
      weight = 3
      [languages.es.menu.main.params]
        has_submenu = true
        submenu = [
          { name = "Logistics & Supply Chain", url = "/industries/logistics-supply-chain/" },
          { name = "Insurance", url = "/industries/insurance/" },
          { name = "Banking & Financial Services", url = "/industries/banking-financial-services/" },
          { name = "Telecom", url = "/industries/telecom/" },
          { name = "Marketing", url = "/industries/marketing/" },
        ]

    [[languages.es.menu.main]]
      name = "Casos de uso"
      url = "/es/use-cases/"
      weight = 4

    [[languages.es.menu.main]]
      name = "Precios"
      url = "/es/pricing"
      weight = 6

  [languages.pt]
    locale = "pt-br"
    label = "Português"
    weight = 4

    [languages.pt.params.header.buttons.getStarted]
      text = "Agende uma Consulta"
      url = "/pt/#contact-form"


    # Same as the French and Spanish blocks above. The old deck promised
    # "maximizar o ROI de suas iniciativas de Transformação Digital" — rule 1, in
    # Portuguese. "Whitepapers" is the label the Portuguese menu already uses.
    [languages.pt.params.blog]
      eyebrow = "Para operações, cadeia de suprimentos, finanças e compliance"
      title = "Whitepapers, e notas mais curtas sobre os mesmos problemas."
      subtitle = "Os whitepapers são os documentos longos: o que Runink FACE e Runink PULSE fazem, e a plataforma CORE sobre a qual os dois rodam. Os textos mais curtos ficam com os problemas por trás deles — uma declaração aduaneira retida por falta de um documento, um pedido de indenização de frete ainda dentro do prazo, uma devolução que custa mais para processar do que a mercadoria, uma cadeia de frio que precisa ser comprovada depois."

    [[languages.pt.menu.main]]
      name = "Por que Runink?"
      url = "/pt/#why-runink"
      weight = 1

    [[languages.pt.menu.main]]
      name = "Whitepapers"
      url = "/pt/blog/whitepapers/"
      weight = 2

    # English pages, Portuguese label — same reasoning as the French block above.
    [[languages.pt.menu.main]]
      name = "Setores"
      url = "/industries/"
      weight = 3
      [languages.pt.menu.main.params]
        has_submenu = true
        submenu = [
          { name = "Logistics & Supply Chain", url = "/industries/logistics-supply-chain/" },
          { name = "Insurance", url = "/industries/insurance/" },
          { name = "Banking & Financial Services", url = "/industries/banking-financial-services/" },
          { name = "Telecom", url = "/industries/telecom/" },
          { name = "Marketing", url = "/industries/marketing/" },
        ]

    [[languages.pt.menu.main]]
      name = "Casos de uso"
      url = "/pt/use-cases/"
      weight = 4

    [[languages.pt.menu.main]]
      name = "Preços"
      url = "/pt/pricing"
      weight = 6

[mediaTypes."application/toon"]
  suffixes = ["toon"]

[outputFormats.TOON]
  mediaType = "application/toon"
  baseName = "index"
  isPlainText = true
  isHTML = false

[outputs]
  home = ["HTML", "RSS", "TOON"]
  page = ["HTML", "TOON"]
  section = ["HTML", "RSS", "TOON"]
  taxonomy = ["HTML", "TOON"]
  term = ["HTML", "RSS", "TOON"]
