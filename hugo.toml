ignoreLogs = ['warning-goldmark-raw-html']
baseURL = "https://runink.org/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
title = "Runink"

# Theme Config
theme = "hugo-saasify-theme"

# Enable syntax highlighting
pygmentsCodeFences = true
pygmentsUseClasses = true

# Enable emoji support
enableEmoji = true

# Enable Git info for lastmod
enableGitInfo = true

# Enable taxonomies
[taxonomies]
  category = 'categories'
  tag = 'tags'

# Pagination
paginate = 6
paginatePath = "page"

[params]
  disablePostCSS = false
  description = ""
  logo = "/images/logo.png"
  googleAnalytics ='G-SEECKDWZNJ'

  # Embedded-app endpoints (Cloud Run URLs) for the /pulse and /demo iframes.
  # This is a PUBLIC repository, and Pulse/FACE are private apps, so the real
  # endpoints are NOT committed here. CI injects them at build time from
  # repository secrets via Hugo's env-var override — HUGO_PARAMS_PULSEAPPURL and
  # HUGO_PARAMS_DEMOAPPURL (see .github/workflows/deploy.yaml). Kept empty so a
  # local/dev build renders the "not configured yet" placeholder rather than a
  # stale URL. (A local preview can export those env vars to point at a running
  # instance.) Note: an iframe src is inherently visible in the deployed public
  # HTML — this keeps infra URLs out of version control and rotatable, not
  # secret from a page viewer.
  pulseAppURL = ""
  demoAppURL = ""
  coreAppURL = ""

  # Global CTA Configuration
  [params.cta]
    enable = true
    title = "Runink: Data You Can Trust. Decisions You Can Defend."
    description = "Your Go-to Hub for for orchestrating secure, testable, and governance-driven data pipelines at scale. Fitting your Cloud, Data Engineering, and advanced analytical initiatives with secure solutions, and cutting-edge compliant technologies."
    gradient_from = "#3A2F2A"  # Indigo-600
    gradient_to = "#1A1512"    # Purple-600
    gradient_angle = 30
    [params.cta.primary_button]
      text = "Book your Consultation"
      url = "/#contact"
  
  # Social Media Links
  [params.social]
    linkedin = "https://www.linkedin.com/company/runink"
  
  # Footer Configuration
  [params.footer]
    enable = false
  
  [params.header]
    # Header background and border styles (optional)
    background = "bg-stone-900/90 backdrop-blur-sm"
    border = "border-b border-stone-800"
    
    # Logo configuration
    [params.header.logo]
      src = "/images/logo.png"
    
    # Menu configuration
    [params.header.menu]
      spacing = "space-x-8"
      
      # Dropdown menu configuration
      [params.header.menu.dropdown]
        width = "w-72"
        container_padding = "py-6"
        item_padding = "px-8 py-3"
        background = "bg-stone-800"
        border = "border border-stone-700"
        shadow = "shadow-xl"
        radius = "rounded-lg"
        text_color = "text-[#F5F1E8]"
        hover_background = "hover:bg-stone-700 hover:text-white"
        text_size = "text-sm"
    
    # Button configuration
    [params.header.buttons]
      # Sign In button
      # [params.header.buttons.signIn]
      #   text = "Sign in"
      #   url = "/signin"
      
      # Get Started button
      [params.header.buttons.getStarted]
        text = "Book your Consultation"
        url = "/#contact"

      # Check it out button
      [params.header.buttons.checkItOut]
        text = "Check it out"
        url = "/demo/"

  # Blog configuration
  [params.blog]
    enable = true
    title = "Publications, Insights & Expertise"
    subtitle = "Explore whitepapers, real-world use cases, and actionable best practices to maximize ROI from your Digital Transformation initiatives."
    
    # Blog CTA configuration
    [params.blog.cta]
      enable = true  # Enable/disable CTA in blog posts
    
    # Sidebar configuration
    [params.blog.sidebar]
      # Recent articles section
      [params.blog.sidebar.recent]
        enable = true
        title = "Recent Articles"
        count = 5
      
      # Categories section
      [params.blog.sidebar.categories]
        enable = true
        title = "Categories"
      
      # Tags section
      [params.blog.sidebar.tags]
        enable = true
        title = "Popular Tags"
        count = 20

      # Subscribe form section
      # [params.blog.sidebar.subscribe]
      #   enable = true
      #   title = "Subscribe to Newsletter"
      #   description = "Get the latest posts delivered right to your inbox"
      #   action = "https://formspree.io/f/your-form-id"
      #   emailName = "email"
      #   buttonText = "Subscribe"
      #   placeholder = "Enter your email"
      #   disclaimer = "We respect your privacy. Unsubscribe at any time."

[module]
  [module.hugoVersion]
    extended = true
    min = "0.80.0"
  
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"

[build]
  writeStats = false

[minify]
  disableXML = true
  useResourceCacheWhen = "never"

[build.buildStats]
  enable = true

[security.funcs]
  getenv = ['^HUGO_', '^CI$']

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = true
    codeFences = true
    guessSyntax = true
    lineNumbersInTable = true
  [markup.goldmark.renderer]
    unsafe = false
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

[languages]
  [languages.en]
    locale = "en-us"
    label = "English"
    weight = 1

    [[languages.en.menu.main]]
      name = "Why Runink?"
      url = "/#why-runink"
      weight = 1

    [[languages.en.menu.main]]
      name = "What makes it a painkiller"
      url = "/#painkiller"
      weight = 2

    # Industries sits above Use cases deliberately. The site was organised by
    # capability, which asks a buyer to recognise a product name before they can
    # find their own problem; this is the entry that lets them start from their
    # own industry instead.
    #
    # A dropdown rather than five top-level entries: the header is fixed, the
    # desktop nav already carries five items plus two buttons and four language
    # flags, and five more would either wrap or push the flags off. As a submenu
    # it costs one item's width. On mobile the same menu renders as a labelled
    # group inside the existing full-width panel, which has room.
    #
    # The industry pages exist in English only. These entries therefore point at
    # the same unprefixed paths from every language, so no locale gets a menu
    # entry that 404s. See the note in content/industries/_index.md on why there
    # are no aliases.
    [[languages.en.menu.main]]
      name = "Industries"
      url = "/industries/"
      weight = 3
      [languages.en.menu.main.params]
        has_submenu = true
        submenu = [
          { name = "Logistics & Supply Chain", url = "/industries/logistics-supply-chain/" },
          { name = "Insurance", url = "/industries/insurance/" },
          { name = "Banking & Financial Services", url = "/industries/banking-financial-services/" },
          { name = "Telecom", url = "/industries/telecom/" },
          { name = "Marketing", url = "/industries/marketing/" },
        ]

    [[languages.en.menu.main]]
      name = "Use cases"
      url = "/#use-cases"
      weight = 4

    [[languages.en.menu.main]]
      name = "Blog"
      url = "/blog/"
      weight = 5

    [[languages.en.menu.main]]
      name = "Pricing"
      url = "/pricing"
      weight = 6


  [languages.fr]
    locale = "fr-fr"
    label = "Français"
    weight = 2

    [languages.fr.params.header.buttons.getStarted]
      text = "Réserver une Consultation"
      url = "/fr/#contact"

    [languages.fr.params.header.buttons.checkItOut]
      text = "Découvrez-le"
      url = "/fr/demo/"

    [languages.fr.params.blog]
      title = "Publications, Décryptages & Expertise"
      subtitle = "Explorez nos livres blancs, cas d'usage réels et meilleures pratiques pour maximiser le ROI de vos initiatives de Transformation Digitale."

    [[languages.fr.menu.main]]
      name = "Pourquoi Runink ?"
      url = "/fr/#why-runink"
      weight = 1

    [[languages.fr.menu.main]]
      name = "Ce qui nous différencie"
      url = "/fr/#painkiller"
      weight = 2

    # English pages, French label. The destinations are the unprefixed paths
    # because that is where the pages are; a /fr/industries/ entry would 404.
    [[languages.fr.menu.main]]
      name = "Secteurs"
      url = "/industries/"
      weight = 3
      [languages.fr.menu.main.params]
        has_submenu = true
        submenu = [
          { name = "Logistics & Supply Chain", url = "/industries/logistics-supply-chain/" },
          { name = "Insurance", url = "/industries/insurance/" },
          { name = "Banking & Financial Services", url = "/industries/banking-financial-services/" },
          { name = "Telecom", url = "/industries/telecom/" },
          { name = "Marketing", url = "/industries/marketing/" },
        ]

    [[languages.fr.menu.main]]
      name = "Cas d'usage"
      url = "/fr/#use-cases"
      weight = 4

    [[languages.fr.menu.main]]
      name = "Blog"
      url = "/fr/blog/"
      weight = 5

    [[languages.fr.menu.main]]
      name = "Tarifs"
      url = "/fr/pricing"
      weight = 6

  [languages.es]
    locale = "es-es"
    label = "Español"
    weight = 3

    [languages.es.params.header.buttons.getStarted]
      text = "Reserve una Consulta"
      url = "/es/#contact"

    [languages.es.params.header.buttons.checkItOut]
      text = "Descúbrelo"
