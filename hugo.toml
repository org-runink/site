[mediaTypes."application/toon"]
  suffixes = ["toon"]

[outputFormats.TOON]
  mediaType = "application/toon"
  baseName = "index"
  isPlainText = true
  isHTML = false

[outputs]
  home = ["HTML", "RSS", "TOON"]
  page = ["HTML", "TOON"]
  section = ["HTML", "RSS", "TOON"]
  taxonomy = ["HTML", "TOON"]
  term = ["HTML", "RSS", "TOON"]
