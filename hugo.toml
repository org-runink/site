    # English pages, Spanish label — same reasoning as the French block above.
    [[languages.es.menu.main]]
      name = "Sectores"
      url = "/industries/"
      weight = 3
      [languages.es.menu.main.params]
        has_submenu = true
        submenu = [
          { name = "Logistics & Supply Chain", url = "/industries/logistics-supply-chain/" },
          { name = "Insurance", url = "/industries/insurance/" },
          { name = "Banking & Financial Services", url = "/industries/banking-financial-services/" },
