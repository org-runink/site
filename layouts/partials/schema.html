{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ .Site.Title | jsonify | safeJS }},
  "url": {{ .Site.BaseURL | jsonify | safeJS }},
  "description": {{ .Site.Params.description | jsonify | safeJS }},

  {{/* GEO Entity Relationships Injection for Homepage */}}
  {{ with .Params.partnerships }}
  "mentions": [
    {{ range $index, $partner := . }}
    {{ if $index }},{{ end }}
    {
      "@type": "Organization",
      "name": {{ $partner.name | jsonify | safeJS }},
      "url": {{ $partner.url | default "" | jsonify | safeJS }}
    }
    {{ end }}
  ],
  {{ end }}

  {{ with .Params.case_studies }}
  "citation": [
    {{ range $index, $case := . }}
    {{ if $index }},{{ end }}
    {
      "@type": "Article",
      "headline": {{ $case.title | jsonify | safeJS }},
      "url": {{ $case.url | default "" | jsonify | safeJS }}
    }
    {{ end }}
  ],
  {{ end }}

  {{ with .Params.compliance }}
  "about": [
    {{ range $index, $standard := . }}
    {{ if $index }},{{ end }}
    {
      "@type": "Thing",
      "name": {{ $standard.name | jsonify | safeJS }},
      "sameAs": {{ $standard.url | default "" | jsonify | safeJS }}
    }
    {{ end }}
  ]
  {{ else }}
  "about": []
  {{ end }}
}
</script>
{{ else if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink | jsonify | safeJS }}
  },
  "headline": {{ .Title | jsonify | safeJS }},
  {{ with .Params.description }}"description": {{ . | jsonify | safeJS }},{{ end }}
  {{ $imgUrl := .Params.featured_image }}
  {{ with $imgUrl }}
    {{ $img := resources.Get . }}
    {{ if $img }}
      "image": {
        "@type": "ImageObject",
        {{ if eq $img.MediaType.SubType "svg" }}
        "url": {{ $img.Permalink | jsonify | safeJS }},
        "width": {{ $img.Width | default 1200 }},
        "height": {{ $img.Height | default 630 }}
        {{ else }}
        {{/* Fill, not Resize — see the note in layouts/_default/baseof.html.
             Resize with both dimensions squashes a square source. */}}
        {{ $optimized := $img.Fill "1200x675 webp" }}
        "url": {{ $optimized.Permalink | jsonify | safeJS }},
        "width": {{ $optimized.Width }},
        "height": {{ $optimized.Height }}
        {{ end }}
        {{ if $img.Exif }}
        {{ with $img.Exif.Tags.Artist }}, "creator": { "@type": "Person", "name": {{ . | jsonify | safeJS }} }{{ end }}
        {{ with $img.Exif.Tags.Copyright }}, "copyrightNotice": {{ . | jsonify | safeJS }}{{ end }}
        {{ with $img.Exif.Tags.ImageDescription }}, "description": {{ . | jsonify | safeJS }}{{ end }}
        {{ end }}
      },
    {{ else }}
      "image": {
        "@type": "ImageObject",
        "url": {{ . | absURL | jsonify | safeJS }}
      },
    {{ end }}
  {{ end }}
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",

  {{/* GEO Entity Relationships Injection */}}
  
  {{/* Partnerships mapped to schema.org 'mentions' */}}
  {{ with .Params.partnerships }}
  "mentions": [
    {{ range $index, $partner := . }}
    {{ if $index }},{{ end }}
    {
      "@type": "Organization",
      "name": {{ $partner.name | jsonify | safeJS }},
      "url": {{ $partner.url | default "" | jsonify | safeJS }}
    }
    {{ end }}
  ],
  {{ end }}

  {{/* Case Studies mapped to schema.org 'citation' */}}
  {{ with .Params.case_studies }}
  "citation": [
    {{ range $index, $case := . }}
    {{ if $index }},{{ end }}
    {
      "@type": "Article",
      "headline": {{ $case.title | jsonify | safeJS }},
      "url": {{ $case.url | default "" | jsonify | safeJS }}
    }
    {{ end }}
  ],
  {{ end }}

  {{/* Compliance & Standards mapped to schema.org 'certification' or 'about' */}}
  {{ with .Params.compliance }}
  "about": [
    {{ range $index, $standard := . }}
    {{ if $index }},{{ end }}
    {
      "@type": "Thing",
      "name": {{ $standard.name | jsonify | safeJS }},
      "sameAs": {{ $standard.url | default "" | jsonify | safeJS }}
    }
    {{ end }}
  ],
  {{ end }}

  {{/* AUTHOR TYPE. Every post on this site is bylined to a team — "Runink
       Logistics Operations Team", and its Portuguese equivalent — not to an
       individual. Typing a collective as schema.org/Person is a contradiction:
       Google's Article guidance is explicit that Person is for people and
       Organization is for organizations, and a Person node with no `url` and no
       `sameAs` identifies nobody in any case.

       So a team byline resolves to the canonical Organization node rather than
       inventing a person. If a post is ever bylined to a named individual, that
       name is emitted as a Person and should carry a `url` to an author page —
       which is the honest way to earn the authorship signal, rather than typing
       a department as a human. CONTENT.md rule 11 makes the same point in prose:
       name the author, or let the company own the page. */}}
  {{ $authorName := .Params.author | default .Site.Params.author | default .Site.Title }}
  {{ $isTeam := or (strings.Contains (lower $authorName) "team") (strings.Contains (lower $authorName) "equipe") }}
  "author": {{ if or $isTeam (eq $authorName .Site.Title) }}{ "@id": "https://runink.org/#organization" }{{ else }}{
    "@type": "Person",
    "name": {{ $authorName | jsonify | safeJS }}
  }{{ end }},
  {{/* Reference the canonical Organization by @id rather than restating name
       and logo here. This block used to emit a skeletal Organization on every
       one of 131 Article pages, none of which carried an @id or a url, so none
       of them resolved to an entity. partials/schema-org.html now emits the one
       real node on every page and this points at it. */}}
  "publisher": { "@id": "https://runink.org/#organization" }
}
</script>
{{ else if .IsNode }}

    {
