<div id="consent-banner" class="fixed bottom-0 left-0 right-0 bg-stone-900 text-stone-300 p-4 z-50 flex flex-col md:flex-row items-center justify-between shadow-2xl border-t border-stone-800" style="display: none;">
    <div class="mb-4 md:mb-0 max-w-3xl">
        <p class="text-sm">
            We use cookies and similar technologies to enhance your experience, analyze our traffic, and personalize content. By clicking "Accept All", you consent to our use of cookies.
            Read our <a href="/privacy/" class="text-stone-100 hover:text-primary-400 underline">Privacy Policy</a> for more information.
        </p>
    </div>
    <div class="flex space-x-4">
        <button id="reject-cookies" class="px-4 py-2 text-sm border border-stone-600 rounded-lg hover:bg-stone-800 transition-colors">
            Reject Non-Essential
        </button>
        <button id="accept-cookies" class="px-4 py-2 text-sm bg-signal-fill text-on-fill rounded-lg hover:bg-signal-fill-hover transition-colors">
            Accept All
        </button>
    </div>
</div>
<script>
(function() {
    const consentBanner = document.getElementById('consent-banner');
    const consentTimestamp = localStorage.getItem('cookieConsentTimestamp');
    const now = Date.now();
    // 180 days. This was `300 * 1000` — five MINUTES — so the banner came back
    // five minutes after a visitor accepted it, on every page, forever. On a
    // phone it is a fixed bottom sheet about 185px tall, a quarter of a 390x844
    // viewport, so the cost was not only the nagging: it ate the fold of every
    // page for every returning reader.
    const ttl = 180 * 24 * 60 * 60 * 1000;

    if (!consentTimestamp || (now - parseInt(consentTimestamp, 10) >= ttl)) {
        consentBanner.style.display = '';
        localStorage.removeItem('cookieConsent');
        localStorage.removeItem('cookieConsentTimestamp');
    }

    document.addEventListener('DOMContentLoaded', function() {
        const acceptBtn = document.getElementById('accept-cookies');
        const rejectBtn = document.getElementById('reject-cookies');

        // The gtag('consent', …) calls are what make these buttons mean
        // anything. partials/google-analytics.html defaults every signal to
        // denied before it configures the tag, so until one of these fires the
        // page is loaded but not measured. Writing localStorage alone — which is
        // all this did before — changed nothing at all.
        //
        // `gtag` is defined in <head> by that partial, but only in production
        // and only when a measurement id is set, so guard the call rather than
        // throwing on a local build.
        function setConsent(granted) {
            if (typeof gtag === 'function') {
                gtag('consent', 'update', {
                    'analytics_storage': granted ? 'granted' : 'denied'
                });
            }
        }

        acceptBtn.addEventListener('click', function() {
            localStorage.setItem('cookieConsent', 'accepted');
            localStorage.setItem('cookieConsentTimestamp', Date.now().toString());
            setConsent(true);
            consentBanner.style.display = 'none';
        });

        rejectBtn.addEventListener('click', function() {
            localStorage.setItem('cookieConsent', 'rejected');
            localStorage.setItem('cookieConsentTimestamp', Date.now().toString());
            setConsent(false);
            consentBanner.style.display = 'none';
        });
    });
})();
</script>
