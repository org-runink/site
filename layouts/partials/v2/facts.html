{{/* A panel of titled facts. Call with (dict "p" <block> "id" "..." "signal" bool). */}}
{{ with .p }}
<section class="hp-sec h2-panel{{ if $.signal }} h2-panel--signal{{ end }}" id="{{ $.id }}" aria-labelledby="{{ $.id }}-heading">
  <h2 class="h2-h" id="{{ $.id }}-heading">{{ .heading }}</h2>
  {{ with .lead }}<p class="h2-lead">{{ . }}</p>{{ end }}
  <ul class="h2-facts">
    {{ range .facts }}<li><b>{{ .title }}</b> {{ .body | markdownify }}</li>{{ end }}
  </ul>
  {{ with .more }}<p class="h2-more"><a href="{{ .url | relURL }}">{{ .text }} <span aria-hidden="true">&rarr;</span></a></p>{{ end }}
</section>
{{ end }}
